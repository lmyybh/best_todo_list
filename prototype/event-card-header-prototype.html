<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>事件卡片头部原型</title>
<!-- Throwaway prototype: one proposed header, with the existing layout for comparison. No app data is modified. -->
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#242522;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:13px}main{max-width:850px;margin:48px auto;padding:0 24px}h1{font-size:21px;margin:0 0 10px;font-weight:650}p{color:#777a72;line-height:1.7;margin:0 0 28px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:28px}.label{font-size:12px;color:#777a72;margin:0 0 12px;display:flex;gap:8px;align-items:center}.label strong{color:#26777a;font-weight:600}.card{background:#fff;border:1px solid #dadbd4;border-radius:13px;height:432px;display:flex;flex-direction:column;overflow:hidden;--accent:#65a6be}.header{border-bottom:1px solid #e8e8e2}.title-row{display:flex;align-items:center;gap:10px;min-width:0}.grip{width:8px;height:14px;flex:none;opacity:.6;background-image:radial-gradient(circle,#93978e 1.2px,transparent 1.5px);background-size:4px 4px;cursor:grab}.color{width:9px;height:9px;border-radius:3px;background:var(--accent);flex:none}h2{margin:0;font-size:16px;font-weight:650;line-height:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{border:0;background:transparent;width:26px;height:26px;display:flex;align-items:center;justify-content:center;gap:2px;border-radius:5px;color:#777a72;cursor:pointer;flex:none}.more i{width:2px;height:2px;background:currentColor;border-radius:50%}.more:hover{background:#f0efeb}.more:focus-visible,.text-button:focus-visible{outline:2px solid #26777a;outline-offset:2px}.old .header{padding:16px 16px 14px}.old .title-row{gap:10px}.old .sub{font-size:10px;color:#858981;margin:1px 0 16px 48px}.old .stat{font-size:10px;color:#858981;margin-bottom:8px}.track{height:3px;background:#e8e8e2;overflow:hidden;border-radius:2px}.fill{width:95.12%;height:100%;background:var(--accent)}.new .header{padding:16px 16px 15px}.new .title-row{gap:9px}.new .meta{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:9px 0 9px 17px;font-size:11px;line-height:16px;color:#858981;font-variant-numeric:tabular-nums}.new .meta .completed{color:#62655f}.new .track{margin-left:17px}.tasks{padding:12px 12px;flex:1}.task{display:flex;align-items:center;gap:7px;height:36px;border-radius:6px;white-space:nowrap}.task .grip{margin:0 4px 0 1px}.check{width:15px;height:15px;border:1px solid #92978d;border-radius:50%;flex:none}.task-name{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis}.plus{font-size:18px;font-weight:300;color:#767b71;width:16px;text-align:center}.task .more{width:22px;height:24px}.footer{display:flex;justify-content:space-between;align-items:center;padding:0 18px 17px;height:43px;color:#858981}.text-button{background:none;border:0;padding:0;color:inherit;font:inherit;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:8px}.text-button:hover{color:#26777a}.chevron{width:5px;height:5px;border-right:1px solid;border-bottom:1px solid;transform:rotate(45deg);margin:0 4px 3px 1px}.menu-wrap{position:relative}.menu{position:absolute;right:0;top:30px;width:86px;padding:3px 0;background:white;border:1px solid #e8e8e2;border-radius:6px;box-shadow:0 2px 8px #0000000a;z-index:2}.menu[hidden]{display:none}.menu button{border:0;background:none;display:block;padding:0 10px;height:28px;font:inherit;font-size:12px;text-align:left;width:100%;cursor:pointer;white-space:nowrap}.menu button:hover{background:#f7f6f2}.menu .delete{color:#c45d4e}.notes{margin:22px 0 0;font-size:12px;color:#62655f;line-height:1.9}.notes b{font-weight:500;color:#242522}.status{min-height:20px;font-size:11px;color:#777a72;margin-top:12px}@media(max-width:640px){main{margin:24px auto;padding:0 16px}.comparison{grid-template-columns:1fr;gap:24px}.card{height:365px}.old{order:2}.new{order:1}}
</style>
</head>
<body>
<main>
<h1>卡片头部 · 布局原型</h1>
<p>标题与操作一行，结构数量与完成进度一行。统一对齐，减少零散信息。</p>
<div class="comparison">
<section class="old"><div class="label">当前布局</div><article class="card"><header class="header"><div class="title-row"><span class="grip" aria-hidden="true"></span><span class="color"></span><h2>v4-flash</h2><button class="more" aria-label="更多操作"><i></i><i></i><i></i></button></div><div class="sub">8 个直接子任务</div><div class="stat">39 / 41 已完成</div><div class="track"><div class="fill"></div></div></header><div class="tasks"></div><footer class="footer"><button class="text-button"><span class="plus">+</span>添加任务</button><button class="text-button">已收起 51 项<span class="chevron"></span></button></footer></article></section>
<section class="new"><div class="label"><strong>建议布局</strong><span>集中、对齐、更紧凑</span></div><article class="card"><header class="header"><div class="title-row"><span class="grip" aria-label="拖动事件"></span><span class="color"></span><h2>v4-flash</h2><div class="menu-wrap"><button class="more" id="menu-toggle" aria-label="更多操作" aria-expanded="false"><i></i><i></i><i></i></button><div class="menu" id="menu" hidden><button>重命名</button><button>归档事件</button><button>收起已完成</button><button>放弃</button><button class="delete">删除</button></div></div></div><div class="meta"><span>8 个直接子任务</span><span class="completed">39 / 41 已完成</span></div><div class="track" role="progressbar" aria-label="任务完成进度" aria-valuemin="0" aria-valuemax="41" aria-valuenow="39"><div class="fill"></div></div></header><div class="tasks"></div><footer class="footer"><button class="text-button"><span class="plus">+</span>添加任务</button><button class="text-button">已收起 51 项<span class="chevron"></span></button></footer></article></section>
</div>
<div class="notes"><b>调整重点</b>：拖拽柄独立占位；数量与进度沿同一行对齐；进度条与信息区共用左右边界。保留完整统计口径，不新增百分比。</div>
<div class="status" id="status" aria-live="polite"></div>
</main>
<script>
document.querySelectorAll('.tasks').forEach(area=>{
  for(const name of ['DSpark 高并发下的使用','profile 调优']){
    const row=document.createElement('div');row.className='task';
    row.innerHTML='<span class="grip"></span><span class="check"></span><span class="task-name"></span><span class="plus">+</span><button class="more" aria-label="任务操作"><i></i><i></i><i></i></button>';
    row.querySelector('.task-name').textContent=name;area.append(row);
  }
});
const toggle=document.getElementById('menu-toggle'),menu=document.getElementById('menu');
toggle.addEventListener('click',()=>{menu.hidden=!menu.hidden;toggle.setAttribute('aria-expanded',String(!menu.hidden));});
document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap')){menu.hidden=true;toggle.setAttribute('aria-expanded','false');}if(e.target.closest('button')&&e.target.closest('button')!==toggle){document.getElementById('status').textContent='仅预览布局，不修改任务数据。';}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){menu.hidden=true;toggle.setAttribute('aria-expanded','false');toggle.focus();}});
</script>
</body>
</html>
